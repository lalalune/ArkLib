name: Proximity auxiliary proofs

on:
  push:
    branches: ["codex/proximity-astra-20260904"]
    paths:
      - "scripts/probes/astra_companion_strip_projection.lean"
      - "scripts/probes/astra_companion_6804_ordinary_gates.lean"
      - "scripts/probes/astra_c2_budget_obstruction.lean"
      - "scripts/probes/astra_companion_t_kernel_gates.lean"
      - "scripts/probes/astra_exact_list_projection.lean"
      - "scripts/probes/astra_mca_polynomial_basis.lean"
      - "scripts/probes/astra_mca_pair_basis_complete.lean"
      - "scripts/probes/astra_mca_residual_rows.lean"
      - "scripts/probes/astra_mca_evaluations.lean"
      - "scripts/probes/astra_mca_scalar_projection.lean"
      - "scripts/probes/astra_mca_event_bridge.lean"
      - "scripts/probes/astra_mca_root_relocation.lean"
      - "scripts/probes/astra_mca_four_cubic_seed.lean"
      - "scripts/probes/astra_mca_power_fibers.lean"
      - "scripts/probes/astra_mca_received_assembly.lean"
      - "scripts/probes/astra_mca_production_events.lean"
      - "scripts/probes/astra_mca_production_upper.lean"
      - "scripts/probes/astra_mca_kkh26_upper.lean"
      - "scripts/probes/astra_mca_single_hole.lean"
      - "scripts/probes/astra_mca_production_basis.lean"
      - "scripts/probes/astra_riccati_contact_obstruction.lean"
      - "scripts/probes/astra_quadratic_contact_obstruction.lean"
      - "scripts/check-mca-production-basis.sh"
      - "scripts/check-mca-event-bridge.sh"
      - "ArkLib/Data/CodingTheory/ProximityGap/Frontier/_PrizeShapePrimeP30.lean"
      - ".github/workflows/proximity-strip-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proximity-strip-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [arklib, companion]
    defaults:
      run:
        working-directory: ${{ matrix.project == 'companion' && 'companion' || '.' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out official companion pin
        if: matrix.project == 'companion'
        uses: actions/checkout@v7
        with:
          repository: proximity-prize/proximity-prize
          ref: 032154395c51fd6f77715a7f42d9a987ab9fb48a
          path: companion
      - uses: leanprover/lean-action@v1.5.0
        with:
          lake-package-directory: ${{ matrix.project == 'companion' && 'companion' || '.' }}
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch pinned Mathlib dependencies
        run: '"$GITHUB_WORKSPACE/scripts/lake-locked.sh" exe cache get'
      - name: Build actual MCA event and threshold dependencies
        if: matrix.project == 'arklib'
        run: >-
          "$GITHUB_WORKSPACE/scripts/lake-locked.sh" build
          ArkLib.Data.CodingTheory.ProximityGap.KKH26WitnessSpread
          ArkLib.Data.CodingTheory.ProximityGap.Frontier._PrizeShapePrimeP30
      - name: Check auxiliary proofs and axiom reports
        shell: bash
        env:
          CHECK_MCA_EVENT: ${{ matrix.project == 'arklib' }}
        run: |
          set -euo pipefail
          lean --version
          : > "$RUNNER_TEMP/strip-proof.log"
          for proof in astra_companion_strip_projection astra_companion_6804_ordinary_gates astra_c2_budget_obstruction astra_companion_t_kernel_gates astra_exact_list_projection; do
            python3 "$GITHUB_WORKSPACE/scripts/forbidden_tokens.py" "$GITHUB_WORKSPACE/scripts/probes/$proof.lean"
            lake env lean "$GITHUB_WORKSPACE/scripts/probes/$proof.lean" 2>&1 | tee -a "$RUNNER_TEMP/strip-proof.log"
          done
          bash "$GITHUB_WORKSPACE/scripts/check-mca-production-basis.sh" \
            "$RUNNER_TEMP/proximity-aux-lib" 2>&1 | tee -a "$RUNNER_TEMP/strip-proof.log"
          if [ "$CHECK_MCA_EVENT" = "true" ]; then
            bash "$GITHUB_WORKSPACE/scripts/check-mca-event-bridge.sh" \
              "$RUNNER_TEMP/proximity-aux-lib" 2>&1 | tee -a "$RUNNER_TEMP/strip-proof.log"
          fi
          python3 - "$RUNNER_TEMP/strip-proof.log" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ["GITHUB_WORKSPACE"]) / "scripts"))
          from axiom_audit import ALLOWED, DEP_RE, NODEP_RE
          output = Path(sys.argv[1]).read_text()
          if re.search(r"sorryAx|error:|warning:", output):
              raise SystemExit("Unexpected Lean diagnostic in auxiliary proofs")
          reported = {m[1]: {a.strip() for a in m[2].split(",") if a.strip()}
                      for m in DEP_RE.finditer(output)}
          reported.update({m[1]: set() for m in NODEP_RE.finditer(output)})
          expected = ["AstraCompanionStripProjection." + name for name in (
              "index_card", "mem_low_of_strip_zero", "strip_range_finrank_le", "exists_low_subspace")]
          expected += ["AstraCompanionOrdinary6804Gates." + name for name in (
              "padded_identity_budget", "hybrid_identity_budget", "mixed_characteristic",
              "product_characteristic", "flag_characteristic", "rational_coordinate",
              "padded_coordinate", "weighted_cap_characteristic")]
          expected += ["AstraC2BudgetObstruction." + name for name in (
              "exact_values", "scalar_caps_do_not_imply_six_percent")]
          expected += ["AstraCompanionTKernelGates." + name for name in (
              "row_166", "row_194", "row_197", "ambient_and_cutoffs")]
          expected += ["AstraExactListProjection." + name for name in (
              "avoid_proper_subspaces", "exists_separating_projection",
              "joint_agreements_le_projected", "scalar_budget_to_interleaved",
              "interleaved_budget_to_scalar", "exact_budget_iff", "grand_field_gate",
              "companion_field_gate", "scalar_carrier_field_gate")]
          expected += ["AstraMcaPolynomialBasis." + name for name in (
              "initial_determinant", "change_basis_determinant", "divided_determinant",
              "cofactor_pair_independent", "exists_separated_at_anchor",
              "many_separated_at_anchor", "remove_root_exact", "remove_root_degree",
              "simple_locator_derivative", "cofactor_row_nonzero",
              "remove_root_preserves_eval", "remove_root_preserves_relation",
              "killed_combination_roots", "delete_at_degree", "delete_at_preserves",
              "two_anchor_deleted_determinant", "deleted_locator_formula",
              "cofactor_of_agreement", "exists_basis_after_deletion",
              "exists_basis_after_two_deletions", "production_basis_after_four_deletions",
              "initial_coefficient_relations", "locator_eq_X_pow_sub_one",
              "interpolate_power_fiber", "initial_basis_from_interpolant",
              "initial_basis_of_quarter_partition", "production_deleted_basis_of_quarter_partition",
              "exists_balanced_quarter_partition", "exists_fourth_root_parameters",
              "production_deleted_basis_from_roots",
              "production_anchor_margins")]
          expected += ["ArkLib.ProximityGap.PrizeShapePrimeP30." + name for name in (
              "prime_P", "orderOf_g", "exists_orderOf_two_pow_30")]
          expected += ["AstraMcaPairBasisComplete." + name for name in (
              "basis_determinant_ne_zero", "cramer_numerators_vanish",
              "cramer_numerator_degree", "coefficient_from_locator",
              "pair_basis_complete", "pair_basis_coefficients_unique",
              "pair_basis_constant_span", "production_two_deletion_constant_span",
              "production_four_deletion_linear_span", "constant_change_between_bases",
              "projective_collisions_preserved", "three_core_budget",
              "production_sharp_core_budget")]
          expected += ["AstraMcaResidualRows." + name for name in (
              "row_lift_ne_zero", "row_lift_same_coordinate", "determinant_nonzero_off_domain",
              "basis_values_not_all_zero", "slot_count", "base_row_nonzero",
              "slot_row_nonzero", "row_lift_determinant_zero", "slot_rows_projectively_distinct")]
          expected += ["AstraMcaEvaluations." + name for name in (
              "row_dot_add", "row_dot_smul", "combine_eval", "combine_degree", "core_card",
              "owner_polynomial_degree", "core_agrees", "slot_discrepancy", "received_affine",
              "slot_cancellation", "slot_outside_core", "no_explanation_on_core_insert",
              "core_insert_witness")]
          expected += ["AstraMcaScalarProjection." + name for name in (
              "row_polynomial_degree", "row_polynomial_ne_zero", "row_polynomial_eval",
              "exists_common_nonroot", "exists_nonzero_denominators", "exists_injective_ratios")]
          expected += ["AstraMcaProductionBasis." + name for name in (
              "power_domain_card", "power_domain_roots", "production_deleted_basis",
              "production_residual_rows", "production_projection_arithmetic",
              "production_moment_curve_arithmetic", "production_scalar_projection")]
          expected += ["AstraRiccatiContactObstruction." + name for name in (
              "riccati_contact_expansion", "local_derivative_divisibility",
              "global_derivative_divisibility", "forced_divisor_degree",
              "production_degree_gap", "production_derivative_zero",
              "quadratic_coefficients_zero_of_three", "production_riccati_zero_of_three")]
          expected += ["AstraQuadraticContactObstruction." + name for name in (
              "quadratic_contact_expansion", "local_square_divisibility",
              "multiplicity_degree_bound", "production_square_zero",
              "local_cross_divisibility", "production_cross_zero_except_three",
              "augmented_root_degree", "production_order_three_relation",
              "production_order_three_zero", "production_derivative_coefficients_zero",
              "production_quadratic_zero_of_three", "local_algebraic_divisibility",
              "specialized_degree_lt", "production_algebraic_solution",
              "production_quadratic_contact_zero")]
          if os.environ["CHECK_MCA_EVENT"] == "true":
              expected += [
                  "scalar_inverse_products",
                  "raw_pair_factorization",
                  "pair_factorization",
                  "pairScalar_ne_zero",
                  "pair_eval_eq_iff",
                  "pair_power_eval_eq_iff",
                  "seed_natDegree",
                  "seed_normalization",
                  "no_common_zero",
                  "AstraMcaPowerFibers.eightFiberEquiv",
                  "AstraMcaPowerFibers.fiberPoint_injective",
                  "AstraMcaPowerFibers.powerFiber_card",
                  "AstraMcaPowerFibers.powerFiber_cover",
                  "AstraMcaPowerFibers.powerFiber_disjoint",
                  "AstraMcaPowerFibers.orderOf_fiber_generator",
                  "AstraMcaPowerFibers.mem_powerFiber_iff",
                  "AstraMcaPowerFibers.fiberBlock_card",
                  "AstraMcaPowerFibers.fiberBlocks_card",
                  "AstraMcaPowerFibers.fiberBlocks_disjoint",
                  "AstraMcaPowerFibers.fiberBlocks_three_cover",
                  "AstraMcaPowerFibers.production_fiber_card",
                  "AstraMcaPowerFibers.production_fibers_cover",
                  "AstraMcaPowerFibers.production_fiber_mem_iff",
                  "AstraMcaPowerFibers.production_common_roots_two_prefixes",
                  "AstraMcaPowerFibers.production_common_roots_card",
                  "AstraMcaPowerFibers.production_covered_card",
                  "AstraMcaPowerFibers.production_uncovered_card",
                  "AstraMcaPowerFibers.production_allocation_cover",
                  "AstraMcaPowerFibers.production_allocation_disjoint",
                  "AstraMcaReceivedAssembly.exists_received_word_and_events",
              ]
              expected += ["AstraMcaRootRelocation." + name for name in (
                  "exists_fresh_directions", "exists_simultaneous_directions",
                  "exists_counted_fresh_directions", "production_greedy_arithmetic",
                  "mca_event_of_joint_core_extra", "mca_event_of_reciprocal_extra",
                  "mca_event_of_good_local", "disjoint_event_union",
                  "disjoint_event_card_le_bad_card", "disjoint_event_probability_lower",
                  "disjoint_event_epsMCA_lower")]
              expected += ["AstraMcaEventBridge." + name for name in (
                  "mca_event_from_polynomial_support", "mca_event_of_core_insert")]
              expected += ["AstraMcaProductionEvents." + name for name in (
                  "core_subset_domain", "slot_coordinate_mem_domain", "mem_production_domain_iff",
                  "production_support_arithmetic", "production_slot_event", "production_many_events")]
              expected += ["AstraMcaProductionUpper." + name for name in (
                  "production_code_iff", "production_mca_error_lower",
                  "production_security_exceeded", "production_delta_star_upper")]
              expected += ["AstraMcaKkh26Upper." + name for name in (
                  "production_code_eq_evalCode", "first_prime_rate_half_delta_star_upper")]
              expected += ["AstraMcaSingleHole." + name for name in (
                  "codeword_iff_natDegree", "zero_of_indexed_roots",
                  "hole_direction_no_explanation", "mca_event_iff", "bad_values_card_eq",
                  "value_count_le_epsMCA", "production_single_hole_iff",
                  "production_value_budget_of_security")]
          for declaration in expected:
              if declaration not in reported:
                  raise SystemExit("Missing axiom report: " + declaration)
              if reported[declaration] - ALLOWED:
                  raise SystemExit("Forbidden axioms: " + declaration)
              print("Allowed axioms:", declaration, sorted(reported[declaration]))
          PY
      - name: Retain auxiliary proof log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proximity-auxiliary-${{ matrix.project }}-${{ github.sha }}
          path: ${{ runner.temp }}/strip-proof.log
          if-no-files-found: ignore
