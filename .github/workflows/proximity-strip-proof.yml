name: Proximity auxiliary proofs

on:
  push:
    branches: ["codex/proximity-astra-20260904"]
    paths:
      - "scripts/probes/astra_companion_strip_projection.lean"
      - "scripts/probes/astra_companion_6804_ordinary_gates.lean"
      - "scripts/probes/astra_c2_budget_obstruction.lean"
      - ".github/workflows/proximity-strip-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proximity-strip-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [arklib, companion]
    defaults:
      run:
        working-directory: ${{ matrix.project == 'companion' && 'companion' || '.' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out official companion pin
        if: matrix.project == 'companion'
        uses: actions/checkout@v7
        with:
          repository: proximity-prize/proximity-prize
          ref: 032154395c51fd6f77715a7f42d9a987ab9fb48a
          path: companion
      - uses: leanprover/lean-action@v1.5.0
        with:
          lake-package-directory: ${{ matrix.project == 'companion' && 'companion' || '.' }}
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch pinned Mathlib dependencies
        run: '"$GITHUB_WORKSPACE/scripts/lake-locked.sh" exe cache get'
      - name: Check auxiliary proofs and axiom reports
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          : > "$RUNNER_TEMP/strip-proof.log"
          for proof in astra_companion_strip_projection astra_companion_6804_ordinary_gates astra_c2_budget_obstruction; do
            python3 "$GITHUB_WORKSPACE/scripts/forbidden_tokens.py" "$GITHUB_WORKSPACE/scripts/probes/$proof.lean"
            lake env lean "$GITHUB_WORKSPACE/scripts/probes/$proof.lean" 2>&1 | tee -a "$RUNNER_TEMP/strip-proof.log"
          done
          python3 - "$RUNNER_TEMP/strip-proof.log" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ["GITHUB_WORKSPACE"]) / "scripts"))
          from axiom_audit import ALLOWED, DEP_RE, NODEP_RE
          output = Path(sys.argv[1]).read_text()
          if re.search(r"sorryAx|error:|warning:", output):
              raise SystemExit("Unexpected Lean diagnostic in auxiliary proofs")
          reported = {m[1]: {a.strip() for a in m[2].split(",") if a.strip()}
                      for m in DEP_RE.finditer(output)}
          reported.update({m[1]: set() for m in NODEP_RE.finditer(output)})
          expected = ["AstraCompanionStripProjection." + name for name in (
              "index_card", "mem_low_of_strip_zero", "strip_range_finrank_le", "exists_low_subspace")]
          expected += ["AstraCompanionOrdinary6804Gates." + name for name in (
              "padded_identity_budget", "hybrid_identity_budget", "mixed_characteristic",
              "product_characteristic", "flag_characteristic", "rational_coordinate",
              "padded_coordinate", "weighted_cap_characteristic")]
          expected += ["AstraC2BudgetObstruction." + name for name in (
              "exact_values", "scalar_caps_do_not_imply_six_percent")]
          for declaration in expected:
              if declaration not in reported:
                  raise SystemExit("Missing axiom report: " + declaration)
              if reported[declaration] - ALLOWED:
                  raise SystemExit("Forbidden axioms: " + declaration)
              print("Allowed axioms:", declaration, sorted(reported[declaration]))
          PY
